# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Development-only OIDC app for FHIR Studio Server BFF SSO.
# Secrets are intentionally hardcoded and checked in — localhost use only.
version: 1
metadata:
  name: fhir-studio-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: fhir-studio-roles-scope
    state: present
    identifiers:
      name: FHIR Studio roles
    attrs:
      name: FHIR Studio roles
      scope_name: profile
      expression: |
        return {
            "roles": [g.name for g in request.user.ak_groups.all()],
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: fhir-studio-provider
    state: present
    identifiers:
      name: fhir-studio-provider
    attrs:
      name: fhir-studio-provider
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      client_type: confidential
      client_id: fhir-studio-development
      client_secret: fhir-studio-development-secret
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_email
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/sso/callback
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://localhost:4200
          redirect_uri_type: logout
        - matching_mode: strict
          url: http://localhost:4200/
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !KeyOf fhir-studio-roles-scope

  - model: authentik_core.application
    id: fhir-studio-application
    state: present
    identifiers:
      slug: fhir-studio
    attrs:
      name: FHIR Studio
      slug: fhir-studio
      meta_launch_url: http://localhost:4200/
      policy_engine_mode: any
      provider: !KeyOf fhir-studio-provider

  - model: authentik_core.group
    id: fhir-studio-admin-group
    state: present
    identifiers:
      name: fhir-studio-admin
    attrs:
      name: fhir-studio-admin

  - model: authentik_core.group
    id: fhir-studio-user-group
    state: present
    identifiers:
      name: fhir-studio-user
    attrs:
      name: fhir-studio-user

  - model: authentik_core.user
    id: fhir-studio-admin-user
    state: present
    identifiers:
      username: administrator
    attrs:
      username: administrator
      name: FHIR Studio Administrator
      email: administrator@localhost
      password: password
      path: users
      is_active: true
      groups:
        - !KeyOf fhir-studio-admin-group

  - model: authentik_core.user
    id: fhir-studio-regular-user
    state: present
    identifiers:
      username: user
    attrs:
      username: user
      name: Practitioner User
      email: user@localhost
      password: password
      path: users
      is_active: true
      groups:
        - !KeyOf fhir-studio-user-group
