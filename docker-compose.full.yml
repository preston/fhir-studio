# Full local stack: infra from docker-compose.development.yml plus prebuilt FHIR Studio images.
#
# Prerequisites:
#   cp server/.env.example server/.env
#   docker build -f server/Dockerfile -t fhir-studio-server:latest .
#   docker build -f ui/Dockerfile -t fhir-studio-ui:latest .
#
# Usage:
#   docker compose -f docker-compose.full.yml up -d
#   open http://localhost:4200/
#
# server/.env supplies optional hosting, bootstrap, and signing settings.
# Compose overrides database and HAPI URLs to container DNS, and pins the
# development Authentik client. extra_hosts maps localhost to the host so the
# issuer URL http://localhost:9000 still reaches Authentik.
#
# Application hosting (after enabling it in server/.env and creating the content
# directory; see doc/application-hosting.md):
#   docker compose -f docker-compose.full.yml --profile hosting up -d

# Same project name as docker-compose.development.yml so named volumes are shared.
name: fhir-studio-full

include:
  - path: docker-compose.development.yml

x-fhir-studio-server-environment: &fhir-studio-server-environment
  NODE_ENV: development
  PORT: 3000
  FHIR_STUDIO_SERVER_DATABASE_URL: postgresql://postgres:password@fhir-studio-postgres:5432/fhir_studio_development
  DATABASE_URL: postgresql://postgres:password@fhir-studio-postgres:5432/fhir_studio_development
  FHIR_STUDIO_SERVER_SSO_ISSUER_URL: http://localhost:9000/application/o/fhir-studio/
  FHIR_STUDIO_SERVER_SSO_CLIENT_ID: fhir-studio-development
  FHIR_STUDIO_SERVER_SSO_CLIENT_SECRET: fhir-studio-development-secret
  FHIR_STUDIO_SERVER_SSO_REDIRECT_URL: http://localhost:3000/sso/callback
  FHIR_STUDIO_SERVER_SSO_SCOPES: openid profile email offline_access
  FHIR_STUDIO_SERVER_SSO_POST_LOGOUT_REDIRECT_URL: http://localhost:4200
  FHIR_STUDIO_SERVER_UI_BASE_URL: http://localhost:4200
  FHIR_STUDIO_SERVER_CORS_ORIGINS: http://localhost:4200
  FHIR_STUDIO_SERVER_SESSION_SECRET: fhir-studio-development-session-secret-32b
  FHIR_STUDIO_SERVER_API_TOKEN_PEPPER: fhir-studio-development-api-token-pepper-32b
  FHIR_STUDIO_HAPI_R4_BASE_URL: http://fhir-studio-hapi-r4:8080/fhir
  FHIR_STUDIO_HAPI_R4B_BASE_URL: http://fhir-studio-hapi-r4b:8080/fhir
  FHIR_STUDIO_HAPI_R5_BASE_URL: http://fhir-studio-hapi-r5:8080/fhir
  FHIR_STUDIO_HOSTING_ROOT: /var/lib/fhir-studio/hosted-apps

services:
  fhir-studio-server:
    image: p3000/fhir-studio-server:latest
    pull_policy: missing
    container_name: fhir-studio-server
    depends_on:
      fhir-studio-postgres:
        condition: service_healthy
      fhir-studio-authentik-server:
        condition: service_started
      fhir-studio-hapi-r4:
        condition: service_started
      fhir-studio-hapi-r4b:
        condition: service_started
      fhir-studio-hapi-r5:
        condition: service_started
    # So OIDC calls to http://localhost:9000 reach Authentik published on the host.
    extra_hosts:
      - "localhost:host-gateway"
    env_file:
      - ./server/.env
    environment:
      <<: *fhir-studio-server-environment
    ports:
      - "3000:3000"
    volumes:
      - ${FHIR_STUDIO_HOSTING_DIRECTORY:-./.data/hosted-apps}:/var/lib/fhir-studio/hosted-apps:ro
    restart: unless-stopped

  # Same image as the API. Image CMD runs migrations and the API; this process only consumes the queue.
  # No container_name so `docker compose up --scale fhir-studio-worker=N` works.
  # stop_grace_period covers worker SHUTDOWN_GRACE_MS (25s).
  fhir-studio-worker:
    image: p3000/fhir-studio-server:latest
    pull_policy: missing
    depends_on:
      fhir-studio-postgres:
        condition: service_healthy
      fhir-studio-server:
        condition: service_started
      fhir-studio-hapi-r4:
        condition: service_started
      fhir-studio-hapi-r4b:
        condition: service_started
      fhir-studio-hapi-r5:
        condition: service_started
    extra_hosts:
      - "localhost:host-gateway"
    env_file:
      - ./server/.env
    environment:
      <<: *fhir-studio-server-environment
    command: ["node", "build/worker.js"]
    volumes:
      - ${FHIR_STUDIO_HOSTING_DIRECTORY:-./.data/hosted-apps}:/var/lib/fhir-studio/hosted-apps
    stop_grace_period: 30s
    restart: unless-stopped

  fhir-studio-ui:
    image: p3000/fhir-studio-ui:latest
    pull_policy: missing
    container_name: fhir-studio-ui
    depends_on:
      fhir-studio-server:
        condition: service_started
    environment:
      FHIR_STUDIO_SERVER_PUBLIC_API_BASE_URL: http://localhost:3000
    ports:
      - "4200:80"
    restart: unless-stopped

  # Static host for deployed applications. Stays out of the default project while
  # server/.env.example has FHIR_STUDIO_HOSTING_ENABLED=false (the process exits if hosting is off).
  fhir-studio-app-host:
    profiles: ["hosting"]
    image: p3000/fhir-studio-server:latest
    pull_policy: missing
    # Drop GitHub and encryption material loaded from server/.env before the process starts.
    command:
      - sh
      - -c
      - |
        unset FHIR_STUDIO_HOSTING_GITHUB_APP_ID \
          FHIR_STUDIO_HOSTING_GITHUB_CLIENT_ID \
          FHIR_STUDIO_HOSTING_GITHUB_CLIENT_SECRET \
          FHIR_STUDIO_HOSTING_GITHUB_PRIVATE_KEY \
          FHIR_STUDIO_HOSTING_GITHUB_WEBHOOK_SECRET \
          FHIR_STUDIO_HOSTING_GITHUB_SLUG \
          FHIR_STUDIO_HOSTING_ENCRYPTION_KEY \
          FHIR_STUDIO_HOSTING_ENCRYPTION_KEY_PREVIOUS
        exec node build/hosted/host.js
    depends_on:
      fhir-studio-server:
        condition: service_started
    extra_hosts:
      - "localhost:host-gateway"
    env_file:
      - ./server/.env
    environment:
      <<: *fhir-studio-server-environment
      PORT: 8081
    volumes:
      - ${FHIR_STUDIO_HOSTING_DIRECTORY:-./.data/hosted-apps}:/var/lib/fhir-studio/hosted-apps:ro
    ports:
      - "127.0.0.1:8086:8081"
    restart: unless-stopped
