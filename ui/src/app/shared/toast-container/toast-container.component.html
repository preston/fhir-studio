<div class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast show align-items-center mb-2 shadow"
      [class]="'text-bg-' + toast.tone"
      [attr.role]="toast.tone === 'danger' ? 'alert' : 'status'"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div class="toast-body text-break">
          @if (toast.title) {
            <div class="fw-bold mb-1">{{ toast.title }}</div>
          }
          <div>{{ toast.message }}</div>
        </div>
        @if (toast.dismissible) {
          <button
            type="button"
            class="btn-close me-2 m-auto flex-shrink-0"
            [class.btn-close-white]="toast.tone !== 'light' && toast.tone !== 'secondary'"
            aria-label="Close notification"
            (click)="toastService.dismiss(toast.id)"
          ></button>
        }
      </div>
    </div>
  }
</div>
